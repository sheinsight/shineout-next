<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Table Mount Bench</title>
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      .bench-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .bench-toolbar button {
        padding: 4px 10px;
        font: inherit;
        cursor: pointer;
      }
      .bench-label {
        font-weight: 600;
      }
      #bench-log {
        margin: 0 0 12px;
        padding: 8px;
        min-height: 40px;
        max-height: 200px;
        overflow: auto;
        background: #f5f5f5;
        font: 12px/1.5 Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      #bench-log:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="bench-toolbar" id="bench-toolbar"></div>
    <pre id="bench-log"></pre>
    <div id="wrap"><div id="app"></div></div>
    <script src="vendor/meta.js"></script>
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script>
      // 两个产物都通过 UMD 暴露全局 Shineout，所以每个页面只加载其中一个，由 runner 用 iframe 逐个加载
      (function () {
        var slot = new URLSearchParams(location.search).get('slot') === 'base' ? 'base' : 'current';
        document.write('<script src="vendor/shineout-' + slot + '.min.js"><\/script>');
      })();
    </script>
    <script src="bench.js"></script>
  </body>
</html>
